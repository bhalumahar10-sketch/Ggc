name: RDP-6-Hours

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and Create User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Open" dir=in action=allow protocol=TCP localport=3389
          $pw = -join ((33..126) | Get-Random -Count 16 | ForEach-Object {[char]$_})
          $pass = ConvertTo-SecureString $pw -AsPlainText -Force
          Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue | Remove-LocalUser
          New-LocalUser -Name "RDP" -Password $pass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$pw" >> $env:GITHUB_ENV

      - name: Install Cloudflared
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\cf.msi" -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\cf.msi`" /quiet /norestart" -Wait
          $exe = "C:\Program Files (x86)\cloudflared\cloudflared.exe"
          if (!(Test-Path $exe)) { $exe = "C:\Program Files\cloudflared\cloudflared.exe" }
          echo "CF_EXE=$exe" >> $env:GITHUB_ENV

      - name: Start Tunnel
        run: |
          Start-Process $env:CF_EXE -ArgumentList "tunnel --url rdp://localhost:3389 --no-autoupdate" -WindowStyle Hidden -RedirectStandardOutput "$env:TEMP\cf.log" -RedirectStandardError "$env:TEMP\cf.err"
          $addr = ""
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 5
            $c = Get-Content "$env:TEMP\cf.log" -Raw -ErrorAction SilentlyContinue
            if ($c -match "rdp://([a-z0-9-]+\.trycloudflare\.com:\d+)") { $addr = $Matches[1]; break }
          }
          if ($addr -eq "") { Write-Error "Tunnel failed"; exit 1 }
          echo "ADDR=$addr" >> $env:GITHUB_ENV

      - name: Show Login Details
        run: |
          Write-Host "===== RDP LOGIN ====="
          Write-Host "Address: $env:ADDR"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"

      - name: Keep Alive 6 Hours
        run: |
          $min = 0
          while ($min -lt 350) {
            Start-Sleep -Seconds 300
            $min += 5
            Write-Host "[$min min] RDP running - $env:ADDR"
          }
          
